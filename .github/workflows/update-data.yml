name: Update data

# Collects the news feeds, Google News ranks and Google Trends on GitHub's servers, so the
# GitHub Pages site (which cannot read them from the browser) only has to read data/snapshot.json.
on:
  schedule:
    # Hourly, at an off-peak minute on purpose: GitHub delays or drops scheduled runs at :00 and :30.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jsdom
        run: npm install --no-save jsdom@24

      - name: Build snapshot
        run: node scripts/build-snapshot.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
